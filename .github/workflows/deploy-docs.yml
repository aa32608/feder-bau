name: Build and publish docs

on:
  push:
    branches: [ main ]
    # Ignore docs commits to avoid recursive workflow runs
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Prepare docs
        run: |
          rm -rf docs
          cp -r dist docs
          cp docs/index.html docs/404.html || true
          touch docs/.nojekyll

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "chore(docs): publish site from CI" || echo "No changes to commit"
          git push origin HEAD:main
